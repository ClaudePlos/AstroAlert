name: Publikacja portalu na GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Zbuduj i wypchnij na Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Bez jawnego "ref" checkout bierze commit sprzed przebiegu, a zadanie
      # zbierające dane commituje dopiero w trakcie - portal publikowałby
      # wtedy dane o jeden przebieg starsze.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sprawdź, czy dane są poprawne
        run: python -c "import json; json.load(open('data/events.json'))"

      - uses: actions/configure-pages@v5

      # portal jest statyczny - wysyłamy repozytorium takie, jakie jest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4
