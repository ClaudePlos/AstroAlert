<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroAlert – co ciekawego dzieje się w kosmosie</title>
<meta name="description" content="Codziennie aktualizowany kalendarz wydarzeń astronomicznych i kosmicznych: zaćmienia, koniunkcje planet, roje meteorów, starty rakiet, zorze polarne i bliskie przeloty planetoid.">
<meta property="og:title" content="AstroAlert">
<meta property="og:description" content="Kalendarz zjawisk na niebie i wydarzeń kosmicznych, odświeżany automatycznie każdego dnia.">
<meta property="og:type" content="website">
<link rel="alternate" type="application/rss+xml" title="AstroAlert – RSS (polski)" href="feed.xml">
<link rel="alternate" type="application/rss+xml" title="AstroAlert – RSS (English)" href="feed.en.xml">
<link rel="alternate" hreflang="pl" href="?lang=pl">
<link rel="alternate" hreflang="en" href="?lang=en">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
</head>
<body>
<div class="starfield" aria-hidden="true"></div>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🔭</span>
      <div>
        <h1>AstroAlert</h1>
        <p class="tagline" id="tagline">…</p>
      </div>
    </div>
    <div class="header-side">
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Language / Język"></div>
      <p class="updated"><span id="updated-label"></span> <time id="generated">…</time>
        · <a id="feed-link" href="feed.xml">RSS</a></p>
    </div>
  </div>
</header>

<main class="wrap">

  <section id="hero" class="hero" hidden>
    <article class="hero-event">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h2 id="hero-title">—</h2>
      <p id="hero-when" class="hero-when"></p>
      <div id="hero-countdown" class="countdown" role="timer" aria-live="polite"></div>
      <p id="hero-summary" class="hero-summary"></p>
      <div id="hero-links" class="links"></div>
    </article>
    <aside id="apod" class="apod" hidden>
      <p class="eyebrow" id="apod-eyebrow"></p>
      <a id="apod-link" href="#" target="_blank" rel="noopener">
        <img id="apod-img" alt="" loading="lazy">
      </a>
      <h3 id="apod-title"></h3>
      <p id="apod-credit" class="credit"></p>
    </aside>
  </section>

  <section class="controls" aria-label="Filters">
    <div class="views" id="views" role="tablist"></div>
    <div class="search-row">
      <input id="search" type="search" autocomplete="off">
      <label class="toggle"><input type="checkbox" id="only-big"><span id="only-big-label"></span></label>
      <label class="toggle"><input type="checkbox" id="show-past"><span id="show-past-label"></span></label>
    </div>
    <div id="filters" class="chips" role="group"></div>
  </section>

  <p id="status" class="status" role="status">…</p>
  <div id="timeline" class="timeline"></div>
  <p id="empty" class="empty" hidden></p>

</main>

<footer class="site-footer">
  <div class="wrap">
    <div>
      <h2 id="sources-heading"></h2>
      <ul id="sources" class="sources"></ul>
    </div>
    <div>
      <h2 id="about-heading"></h2>
      <p id="about-text"></p>
      <p id="about-tz"></p>
    </div>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
